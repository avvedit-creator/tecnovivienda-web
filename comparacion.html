<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antes / Después — Tecno Vivienda</title>
<meta name="description" content="Compara la web actual de Tecno Vivienda con la propuesta de rediseño, página por página.">
<meta property="og:type" content="website">
<meta property="og:title" content="Antes / Después — Tecno Vivienda">
<meta property="og:description" content="Arrastra para comparar tu web actual con el nuevo diseño, página por página.">
<meta property="og:image" content="https://nuevatecnovivienda.netlify.app/assets/comparacion/despues/01-inicio.jpg">
<meta property="og:url" content="https://nuevatecnovivienda.netlify.app/comparacion.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-50:#F2EFE7;
    --stone-100:#E7E1D3;
    --stone-200:#D9D0BC;
    --ink-900:#221E19;
    --ink-700:#4B4438;
    --ink-500:#726A5B;
    --green-700:#B7302E;
    --green-800:#8C2321;
    --green-050:#F5E4E2;
    --brick-500:#AD4E2C;
    --gold-500:#A8823C;
    --line:rgba(34,30,25,0.14);
    --surface:#FFFFFE;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stone-50:#18150F; --stone-100:#221E17; --stone-200:#332C21;
      --ink-900:#F1ECE0; --ink-700:#CFC7B4; --ink-500:#9C9280;
      --green-700:#E2635C; --green-800:#B8433D; --green-050:#3A1C1A;
      --brick-500:#D97F55; --gold-500:#D2AC5F;
      --line:rgba(241,236,224,0.22); --surface:#28221A;
    }
  }
  :root[data-theme="dark"]{
    --stone-50:#18150F; --stone-100:#221E17; --stone-200:#332C21;
    --ink-900:#F1ECE0; --ink-700:#CFC7B4; --ink-500:#9C9280;
    --green-700:#E2635C; --green-800:#B8433D; --green-050:#3A1C1A;
    --brick-500:#D97F55; --gold-500:#D2AC5F;
    --line:rgba(241,236,224,0.22); --surface:#28221A;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--stone-50); color:var(--ink-900);
    font-family:"Libre Franklin", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  h1,h2{ font-family:"Fraunces", Georgia, serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  a{color:inherit;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line); background:var(--surface);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:"Fraunces",serif; font-weight:600; font-size:1.1rem; }
  .brand .mark{ background:var(--green-700); color:#fff; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:3px; font-size:0.85rem; }
  header a.cta{
    font-size:0.85rem; font-weight:600; text-decoration:none; color:var(--surface);
    background:var(--green-700); padding:9px 16px; border-radius:3px;
  }

  main{ max-width:1100px; margin:0 auto; padding:36px 20px 80px; }
  .intro{ text-align:center; max-width:640px; margin:0 auto 32px; }
  .intro h1{ font-size:clamp(1.6rem,4vw,2.3rem); margin-bottom:10px; }
  .intro p{ color:var(--ink-700); font-size:1rem; margin:0; }

  .tabs{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:24px;
  }
  .tabs button{
    font-family:inherit; font-size:0.85rem; font-weight:600; color:var(--ink-700);
    background:var(--surface); border:1px solid var(--line); padding:9px 16px;
    border-radius:999px; cursor:pointer; transition:all .15s ease;
  }
  .tabs button.active{ background:var(--green-700); border-color:var(--green-700); color:#fff; }

  .slider-wrap{
    position:relative; width:100%; aspect-ratio:1440/900; max-width:1100px; margin:0 auto;
    border-radius:6px; overflow:hidden; box-shadow:0 12px 40px rgba(34,30,25,0.18);
    border:1px solid var(--line); cursor:ew-resize; user-select:none; touch-action:pan-y;
  }
  .slider-wrap img{
    position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; pointer-events:none; display:block;
  }
  .img-after{ clip-path: inset(0 0 0 50%); }
  .handle{
    position:absolute; top:0; bottom:0; left:50%; width:0; transform:translateX(-50%);
  }
  .handle::before{
    content:""; position:absolute; top:0; bottom:0; left:0; width:3px; background:#fff;
    box-shadow:0 0 0 1px rgba(0,0,0,0.15);
  }
  .handle .grip{
    position:absolute; top:50%; left:0; transform:translate(-50%,-50%);
    width:44px; height:44px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center; gap:2px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .handle .grip span{ width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; }
  .handle .grip span:first-child{ border-right:8px solid var(--ink-900); }
  .handle .grip span:last-child{ border-left:8px solid var(--ink-900); }

  .tag{
    position:absolute; top:16px; font-size:0.7rem; font-weight:700; letter-spacing:0.08em;
    padding:6px 12px; border-radius:999px; color:#fff; text-transform:uppercase;
  }
  .tag-before{ left:16px; background:rgba(34,30,25,0.72); }
  .tag-after{ right:16px; background:var(--green-700); }

  .hint{ text-align:center; color:var(--ink-500); font-size:0.85rem; margin-top:14px; }

  footer{
    text-align:center; padding:28px 20px 40px; color:var(--ink-500); font-size:0.85rem;
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark">T</span> Tecno Vivienda</div>
  <a class="cta" href="index.html">Ver web completa →</a>
</header>

<main>
  <div class="intro">
    <h1>El mismo contenido. Otra web.</h1>
    <p>Arrastra el control para comparar cada página, tal cual está hoy y como quedaría con el nuevo diseño.</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="slider-wrap" id="sliderWrap">
    <img class="img-before" id="imgBefore" alt="Antes">
    <img class="img-after" id="imgAfter" alt="Después">
    <span class="tag tag-before">Antes</span>
    <span class="tag tag-after">Después</span>
    <div class="handle" id="handle"><div class="grip"><span></span><span></span></div></div>
  </div>

  <p class="hint">Desliza hacia los lados — o toca sobre la imagen en el móvil</p>
</main>

<footer>Comparación privada — no indexado</footer>

<script>
  const pages = [
    { id: "01-inicio",   label: "Inicio" },
    { id: "02-comprar",  label: "Comprar" },
    { id: "03-vender",   label: "Vender" },
    { id: "04-alquilar", label: "Alquilar" },
    { id: "05-servicios",label: "Servicios" },
    { id: "06-contacto", label: "Contacto" },
  ];

  const tabsEl = document.getElementById("tabs");
  const imgBefore = document.getElementById("imgBefore");
  const imgAfter = document.getElementById("imgAfter");
  const sliderWrap = document.getElementById("sliderWrap");
  const handle = document.getElementById("handle");

  function setPosition(pct){
    pct = Math.max(0, Math.min(100, pct));
    imgAfter.style.clipPath = `inset(0 0 0 ${pct}%)`;
    handle.style.left = pct + "%";
  }

  function loadPage(page){
    imgBefore.src = `assets/comparacion/antes/${page.id}.jpg`;
    imgAfter.src = `assets/comparacion/despues/${page.id}.jpg`;
    setPosition(50);
    [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.id === page.id));
  }

  pages.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.textContent = p.label;
    btn.dataset.id = p.id;
    btn.addEventListener("click", () => loadPage(p));
    tabsEl.appendChild(btn);
  });

  let dragging = false;
  function pctFromEvent(e){
    const rect = sliderWrap.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    return (x / rect.width) * 100;
  }
  sliderWrap.addEventListener("mousedown", e => { dragging = true; setPosition(pctFromEvent(e)); });
  sliderWrap.addEventListener("touchstart", e => { dragging = true; setPosition(pctFromEvent(e)); }, {passive:true});
  window.addEventListener("mousemove", e => { if(dragging) setPosition(pctFromEvent(e)); });
  window.addEventListener("touchmove", e => { if(dragging) setPosition(pctFromEvent(e)); }, {passive:true});
  window.addEventListener("mouseup", () => dragging = false);
  window.addEventListener("touchend", () => dragging = false);

  loadPage(pages[0]);
</script>

</body>
</html>
